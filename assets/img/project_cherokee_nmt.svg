<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="nmtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg5)" />

  <!-- Seq2Seq Translation Cards -->
  <g transform="translate(400, 180)">
    <!-- English Source Card -->
    <rect x="-220" y="-65" width="170" height="120" rx="12" fill="#0f172a" stroke="#14b8a6" stroke-width="2" filter="url(#glow5)" />
    <text x="-135" y="-30" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SOURCE (English)</text>
    <rect x="-205" y="-12" width="140" height="30" rx="6" fill="#042f2e" />
    <text x="-135" y="8" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">"The water is cold"</text>
    <text x="-135" y="40" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Encoder States</text>

    <!-- Cross Attention / Transformer Bridge -->
    <path d="M -45 -5 L 45 -5" stroke="url(#nmtGrad)" stroke-width="3" stroke-dasharray="5,4" />
    <polygon points="50,-5 40,-10 40,0" fill="#6366f1" />
    <circle cx="0" cy="-5" r="14" fill="#0f172a" stroke="url(#nmtGrad)" stroke-width="2" />
    <text x="0" y="-1" fill="#06b6d4" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">NMT</text>

    <!-- Cherokee Target Card -->
    <rect x="55" y="-65" width="170" height="120" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="2" filter="url(#glow5)" />
    <text x="140" y="-30" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TARGET (Cherokee)</text>
    <rect x="70" y="-12" width="140" height="30" rx="6" fill="#1e1b4b" />
    <text x="140" y="8" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">"ᎠᎹ ᎤᏴᏜ"</text>
    <text x="140" y="40" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Beam Search (k=4)</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 360)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#042f2e" stroke="url(#nmtGrad)" stroke-width="1.5" />
    <text x="0" y="6" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.5">LOW-RESOURCE CHEROKEE NMT</text>
  </g>
</svg>
