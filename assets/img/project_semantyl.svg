<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="ragGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)" />

  <!-- Background Graph Lines -->
  <g stroke="#10b981" stroke-opacity="0.15" stroke-width="1">
    <line x1="150" y1="100" x2="350" y2="180" />
    <line x1="350" y1="180" x2="550" y2="120" />
    <line x1="350" y1="180" x2="450" y2="280" />
    <line x1="200" y1="260" x2="350" y2="180" />
    <line x1="450" y1="280" x2="650" y2="240" />
  </g>

  <!-- Central Search & Knowledge Node -->
  <g transform="translate(400, 185)">
    <!-- Central Node Pulse -->
    <circle cx="0" cy="0" r="48" fill="#064e3b" stroke="url(#ragGrad)" stroke-width="2.5" filter="url(#glow2)" />
    <!-- Magnifying Glass / Vector Symbol -->
    <circle cx="-6" cy="-6" r="16" fill="none" stroke="#f8fafc" stroke-width="3" />
    <line x1="6" y1="6" x2="20" y2="20" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
    <!-- Vector points radiating -->
    <circle cx="-160" cy="-60" r="14" fill="#0f172a" stroke="#34d399" stroke-width="2" />
    <text x="-160" y="-56" fill="#34d399" font-size="9" font-family="-apple-system, sans-serif" font-weight="700" text-anchor="middle">PDF</text>

    <circle cx="-140" cy="70" r="14" fill="#0f172a" stroke="#2dd4bf" stroke-width="2" />
    <text x="-140" y="74" fill="#2dd4bf" font-size="9" font-family="-apple-system, sans-serif" font-weight="700" text-anchor="middle">DOCX</text>

    <circle cx="160" cy="-50" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="160" y="-46" fill="#38bdf8" font-size="9" font-family="-apple-system, sans-serif" font-weight="700" text-anchor="middle">RAG</text>

    <circle cx="150" cy="75" r="15" fill="#0f172a" stroke="#a7f3d0" stroke-width="2" />
    <text x="150" y="79" fill="#a7f3d0" font-size="9" font-family="-apple-system, sans-serif" font-weight="700" text-anchor="middle">LLM</text>

    <!-- Connectors -->
    <line x1="-146" y1="-55" x2="-45" y2="-15" stroke="url(#ragGrad)" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="-126" y1="65" x2="-45" y2="15" stroke="url(#ragGrad)" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="45" y1="-15" x2="144" y2="-45" stroke="url(#ragGrad)" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="45" y1="15" x2="135" y2="70" stroke="url(#ragGrad)" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 360)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#090d16" stroke="url(#ragGrad)" stroke-width="1.5" />
    <text x="0" y="6" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0.5">SEMANTYL : DOCUMENT Q&amp;A</text>
  </g>
</svg>
