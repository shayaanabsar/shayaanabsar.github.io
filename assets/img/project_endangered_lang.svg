<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180c26" />
      <stop offset="50%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="langGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)" />

  <!-- Central Byte Stream & Morphology Tree -->
  <g transform="translate(400, 180)">
    <!-- Central ByT5 Core -->
    <rect x="-70" y="-35" width="140" height="70" rx="14" fill="#2e1065" stroke="url(#langGrad)" stroke-width="2.5" filter="url(#glow3)" />
    <text x="0" y="7" fill="#fdf2f8" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1">ByT5</text>
    <text x="0" y="24" fill="#f472b6" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">BYTE-LEVEL</text>

    <!-- Source Language Tag (Spanish / Finnish / Turkish) -->
    <g transform="translate(-200, 0)">
      <rect x="-65" y="-30" width="130" height="60" rx="10" fill="#180c26" stroke="#ec4899" stroke-width="1.5" />
      <text x="0" y="-5" fill="#f472b6" font-size="12" font-family="-apple-system, sans-serif" font-weight="700" text-anchor="middle">Source Languages</text>
      <text x="0" y="14" fill="#cbd5e1" font-size="10" font-family="-apple-system, sans-serif" text-anchor="middle">es / fi / tr</text>
    </g>

    <!-- Target Endangered Languages (Quechua / Sámi / Crimean Tatar) -->
    <g transform="translate(200, 0)">
      <rect x="-65" y="-30" width="130" height="60" rx="10" fill="#180c26" stroke="#a855f7" stroke-width="1.5" />
      <text x="0" y="-5" fill="#c084fc" font-size="12" font-family="-apple-system, sans-serif" font-weight="700" text-anchor="middle">Low-Resource</text>
      <text x="0" y="14" fill="#cbd5e1" font-size="10" font-family="-apple-system, sans-serif" text-anchor="middle">qu / sme / crh</text>
    </g>

    <!-- Direction Arrows -->
    <path d="M -130 0 L -75 0" stroke="url(#langGrad)" stroke-width="2.5" stroke-dasharray="5,3" />
    <polygon points="-75,0 -85,-5 -85,5" fill="#ec4899" />

    <path d="M 75 0 L 130 0" stroke="url(#langGrad)" stroke-width="2.5" stroke-dasharray="5,3" />
    <polygon points="130,0 120,-5 120,5" fill="#a855f7" />

    <!-- Byte Stream Nodes Top & Bottom -->
    <text x="0" y="-60" fill="#f472b6" font-family="monospace" font-size="11" letter-spacing="3" text-anchor="middle" opacity="0.8">01101100 01100101 01101101 01101101 01100001</text>
    <text x="0" y="75" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cross-Lingual Morphological Transfer</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 360)">
    <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#180c26" stroke="url(#langGrad)" stroke-width="1.5" />
    <text x="0" y="6" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.5">ENDANGERED LANGUAGE MORPHOLOGY</text>
  </g>
</svg>
