<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Document Shape -->
  <g transform="translate(180, 85)">
    <rect x="0" y="0" width="160" height="220" rx="12" fill="url(#docGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="25" y1="35" x2="80" y2="35" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="25" y1="65" x2="135" y2="65" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" />
    <line x1="25" y1="85" x2="120" y2="85" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" />
    <line x1="25" y1="105" x2="135" y2="105" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" />
    <line x1="25" y1="125" x2="105" y2="125" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" />
    <rect x="25" y="150" width="110" height="45" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.6" />
    <text x="80" y="177" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">FAISS INDEX</text>
  </g>

  <!-- Flow Connector -->
  <path d="M 370 195 L 430 195" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4" filter="url(#glow)" />
  <polygon points="435,195 425,190 425,200" fill="#818cf8" />

  <!-- Waveform / Audio Card -->
  <g transform="translate(460, 85)">
    <rect x="0" y="0" width="180" height="220" rx="12" fill="url(#docGrad)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="90" cy="55" r="28" fill="#1e1b4b" stroke="#c084fc" stroke-width="2" filter="url(#glow)" />
    <!-- Headphone Icon -->
    <path d="M 75 55 A 15 15 0 0 1 105 55 V 65 A 3 3 0 0 1 102 68 H 100 V 55 H 105 M 75 55 V 65 A 3 3 0 0 0 78 68 H 80 V 55 H 75" fill="none" stroke="#e0e7ff" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Sound Waves -->
    <g transform="translate(25, 125)">
      <rect x="5" y="25" width="4" height="20" rx="2" fill="url(#waveGrad)" />
      <rect x="15" y="15" width="4" height="40" rx="2" fill="url(#waveGrad)" />
      <rect x="25" y="5" width="4" height="60" rx="2" fill="url(#waveGrad)" />
      <rect x="35" y="20" width="4" height="30" rx="2" fill="url(#waveGrad)" />
      <rect x="45" y="0" width="4" height="70" rx="2" fill="url(#waveGrad)" />
      <rect x="55" y="10" width="4" height="50" rx="2" fill="url(#waveGrad)" />
      <rect x="65" y="22" width="4" height="26" rx="2" fill="url(#waveGrad)" />
      <rect x="75" y="5" width="4" height="60" rx="2" fill="url(#waveGrad)" />
      <rect x="85" y="15" width="4" height="40" rx="2" fill="url(#waveGrad)" />
      <rect x="95" y="0" width="4" height="70" rx="2" fill="url(#waveGrad)" />
      <rect x="105" y="18" width="4" height="34" rx="2" fill="url(#waveGrad)" />
      <rect x="115" y="28" width="4" height="14" rx="2" fill="url(#waveGrad)" />
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 360)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#0f172a" stroke="url(#waveGrad)" stroke-width="1.5" />
    <text x="0" y="6" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0.5">PAPERS-TO-PODCASTS</text>
  </g>
</svg>
