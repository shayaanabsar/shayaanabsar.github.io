<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg4)" />

  <!-- Transformer Block Architecture Illustration -->
  <g transform="translate(400, 180)">
    <!-- Multi-Head Attention Block -->
    <rect x="-180" y="-70" width="160" height="130" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2" filter="url(#glow4)" />
    <text x="-100" y="-38" fill="#fb923c" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Multi-Head</text>
    <text x="-100" y="-20" fill="#fb923c" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Attention</text>
    
    <!-- Mini Attention Matrix Grid -->
    <g transform="translate(-140, 0)">
      <rect x="0" y="0" width="16" height="16" fill="#fb923c" opacity="0.9" rx="2" />
      <rect x="22" y="0" width="16" height="16" fill="#fb923c" opacity="0.3" rx="2" />
      <rect x="44" y="0" width="16" height="16" fill="#fb923c" opacity="0.1" rx="2" />
      <rect x="66" y="0" width="16" height="16" fill="#fb923c" opacity="0.0" rx="2" />

      <rect x="0" y="20" width="16" height="16" fill="#fb923c" opacity="0.8" rx="2" />
      <rect x="22" y="20" width="16" height="16" fill="#fb923c" opacity="0.7" rx="2" />
      <rect x="44" y="20" width="16" height="16" fill="#fb923c" opacity="0.2" rx="2" />
      <rect x="66" y="20" width="16" height="16" fill="#fb923c" opacity="0.0" rx="2" />

      <rect x="0" y="40" width="16" height="16" fill="#fb923c" opacity="0.6" rx="2" />
      <rect x="22" y="40" width="16" height="16" fill="#fb923c" opacity="0.9" rx="2" />
      <rect x="44" y="40" width="16" height="16" fill="#fb923c" opacity="0.8" rx="2" />
      <rect x="66" y="40" width="16" height="16" fill="#fb923c" opacity="0.4" rx="2" />
    </g>

    <!-- Arrow Connection -->
    <path d="M -15 -5 L 20 -5" stroke="url(#torchGrad)" stroke-width="2.5" stroke-dasharray="4,3" />
    <polygon points="20,-5 12,-10 12,0" fill="#38bdf8" />

    <!-- Feed-Forward / Linear Projection Block -->
    <rect x="25" y="-70" width="160" height="130" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow4)" />
    <text x="105" y="-38" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Feed-Forward</text>
    <text x="105" y="-20" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Network</text>
    <text x="105" y="15" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Linear(d, 4d)</text>
    <text x="105" y="35" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">GELU / Pre-LN</text>
    <text x="105" y="55" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Linear(4d, d)</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 360)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#090a0f" stroke="url(#torchGrad)" stroke-width="1.5" />
    <text x="0" y="6" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0.5">PYTORCH GPT FROM SCRATCH</text>
  </g>
</svg>
