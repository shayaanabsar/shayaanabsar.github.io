        summary: Ten-week research placement funded by the Engineering and Physical Sciences Research Council (EPSRC). Supervised by Prof. Oisin Mac Aodha, with collaborators at Google DeepMind, Cambridge, and EPFL.
        highlights:
          - Built the project's evaluation pipeline in Python, covering data ingestion in R, feature engineering, scikit-learn baselines, and batched inference across three commercial LLMs over 7,334 ecological records.
          - Benchmarked models against statistical and heuristic baselines, with the top model reaching 63.3% accuracy vs. 58.0% best baseline.
          - Demonstrated that chain-of-thought prompting did not consistently improve accuracy on the task and that its benefit lay in calibration rather than decisions.
          - Designed a configuration-driven sweep harness to vary models, prompting conditions, and baselines against held-out splits with cached inference.
      - company: University of Edinburgh Business School
        position: Research Assistant in Natural Language Processing
        location: Edinburgh, UK
        start_date: 2025-01
        end_date: 2025-04
        summary: Scalable NLP pipeline analyzing climate-related disclosure across corporate conference call transcripts.
        highlights:
          - Built an NLP pipeline analyzing climate-related language across 250+ corporate earnings call transcripts.
          - Extended Sauttner et al. (2023) methodology for climate bigram identification using transformer models.
          - Trained and evaluated classification models (Naïve Bayes, Random Forest, Logistic Regression) for thematic detection.

