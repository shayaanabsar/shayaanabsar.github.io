    Experience:
      - company: University of Edinburgh
        position: Undergraduate Research Intern (EPSRC)
        location: Edinburgh, UK
        start_date: 2026-06
        end_date: 2026-08
        summary: Ten-week research placement funded by the Engineering and Physical Sciences Research Council (EPSRC). Supervised by Prof. Oisin Mac Aodha, in collaboration with researchers from Google DeepMind, Cambridge, and EPFL.
        highlights:
          - Built the project's evaluation pipeline in Python covering data ingestion, feature engineering, scikit-learn baselines, and batched inference across three commercial LLMs over a dataset of 7,334 ecological records.
          - Benchmarked models against statistical and heuristic baselines, with the strongest model reaching 63.3% accuracy against a best baseline of 58.0%.
          - Demonstrated that chain-of-thought prompting improved model calibration rather than raw decision accuracy.
          - Designed a configuration-driven sweep harness to vary models, prompting conditions, and baselines against held-out splits with cached inference.

      - company: University of Edinburgh Business School
        position: Research Assistant in Natural Language Processing
        location: Edinburgh, UK
        start_date: 2025-01
        end_date: 2025-04
        summary: Scalable NLP pipeline analyzing climate-related content across corporate disclosures.
        highlights:
          - Built an NLP pipeline analyzing climate-related disclosures across 250+ corporate earnings call transcripts.
          - Extended Sauttner et al. (2023) methodology for climate bigram identification using transformer-based models.
          - Trained and evaluated classification models (Naïve Bayes, Random Forest, Logistic Regression) for thematic detection.

      - company: JPMorgan Chase & Co.
        position: Spring Into Software Engineering & Code for Good
        location: Glasgow, UK
        start_date: 2026-04
        end_date: 2026-04
        summary: Selected for the competitive Spring Into Software Engineering programme and Code for Good hackathon.
        highlights:
          - Built a predictive fire safety system for the National Fire Chiefs Council during the Code for Good hackathon under strict delivery constraints.
          - Trained in Agile and Scrum software engineering methodologies.

    Extracurricular Activities:
      - bullet: "**NLP Lead & Committee Member**, [EdinburghAI](https://edinburghai.org/) *(2024 – Present)*: Direct technical workshops in machine learning & NLP, and coordinate hands-on collaborative coding projects helping members build end-to-end ML applications for a 500+ member university student community."
      - bullet: "**Diversity Officer**, School of Informatics Rugby *(2026 – Present)*: Support club welfare, inclusivity initiatives, and team representation across the university."

    Projects:
      - name: Papers-to-Podcasts
        url: https://github.com/shayaanabsar/papers-to-podcasts
        start_date: 2025
        summary: Multi-stage pipeline converting scientific papers into conversational audio using LLM orchestration, FAISS semantic search, and neural text-to-speech.
        highlights:
          - Deployed on Streamlit Cloud with real-time audio playback and optimized caching.
          - Ingests and processes 10–30 page complex research PDFs in under five minutes.

      - name: "Semantyl: Document Q&A System"
        url: https://github.com/shayaanabsar/Semantyl
        start_date: 2025
        summary: End-to-end retrieval-augmented generation (RAG) platform with multi-format ingestion and real-time query answering.
        highlights:
          - Built using LangChain, Hugging Face dense embeddings, and vector similarity search across PDF, DOCX, and TXT documents.
          - Features conversational retrieval chains, context compression, and source citation tracking.

      - name: Morphological Inflection for Endangered Languages
        url: https://github.com/shayaanabsar/code-switched-pos-tagging
        start_date: 2025
        summary: Byte-level ByT5 framework incorporating cross-lingual transfer for low-resource morphological generation.
        highlights:
          - Outperforms subword tokenizers on polysynthetic and agglutinative languages (Quechua, Northern Sámi, Crimean Tatar).
          - Introduced the Lemma Masking Hypothesis explaining why masked language modeling improves morphological generation.

      - name: PyTorch GPT from Scratch
        url: https://github.com/shayaanabsar/gpt
        start_date: 2024
        summary: Complete implementation of a decoder-only transformer architecture in pure PyTorch.
        highlights:
          - Implemented multi-head causal self-attention, learned positional encodings, and Pre-LN blocks from primitives.
          - Full training loop with gradient accumulation, cosine annealing scheduling, and top-k/nucleus sampling.

      - name: Neural Machine Translation System
        url: https://github.com/shayaanabsar/ch-en-nmt
        start_date: 2024
        summary: Sequence-to-sequence transformer with custom attention mechanisms and beam search decoding for English–Cherokee translation.
        highlights:
          - Custom tokenization and vocabulary construction handling indigenous language morpheme-level representations.

