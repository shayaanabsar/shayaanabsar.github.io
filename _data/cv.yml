    Projects:
      - title: Papers-to-Podcasts
        summary: Multi-stage pipeline converting academic papers into conversational audio using LLM orchestration, FAISS semantic search, and neural text-to-speech. Processes 10–30 page documents in under 5 minutes; deployed on Streamlit Cloud.
      - title: Semantyl
        summary: End-to-end retrieval-augmented generation (RAG) system with LangChain, Hugging Face embeddings, and vector similarity search across PDF, DOCX, and TXT documents.
      - title: Byte-Level Morphological Inflection for Endangered Languages
        summary: ByT5 framework incorporating cross-lingual transfer (Spanish→Quechua, Finnish→Northern Sámi, Turkish→Crimean Tatar) introducing the Lemma Masking Hypothesis for morphological generation in under-resourced languages.
      - title: PyTorch GPT from Scratch
        summary: Character-level generative pretrained transformer built from scratch in PyTorch featuring multi-head self-attention, positional encoding, and learning rate scheduling with gradient accumulation.
      - title: Neural Machine Translation System
        summary: Sequence-to-sequence transformer with custom attention mechanism and beam search decoding for English–Cherokee translation.

